name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  release:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    env:
      POSTGRES_REQUIRE_INTEGRATION: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - 'min'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # TEMPORARY until Reseau 1.5.0 is registered: isvalid needs the unreleased
      # non-blocking tryread! API (JuliaServices/Reseau.jl nonblocking-peek).
      - name: Use unreleased Reseau
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/JuliaServices/Reseau.jl", rev="nonblocking-peek")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # One complete database run is the coverage source. Platform-only runs
      # can omit Docker and must not become a partial coverage baseline.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      - uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  auth-modes:
    name: Auth ${{ matrix.auth }} - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        auth:
          - scram-sha-256
          - md5
    env:
      POSTGRES_REQUIRE_INTEGRATION: 'true'
      POSTGRES_HOST_AUTH_METHOD: ${{ matrix.auth }}
      POSTGRES_INITDB_ARGS: --auth-host=${{ matrix.auth }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      # TEMPORARY until Reseau 1.5.0 is registered: isvalid needs the unreleased
      # non-blocking tryread! API (JuliaServices/Reseau.jl nonblocking-peek).
      - name: Use unreleased Reseau
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/JuliaServices/Reseau.jl", rev="nonblocking-peek")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  postgres-versions:
    name: PostgreSQL ${{ matrix.postgres }} - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL 16 is covered by the main OS and Julia-version matrix.
        postgres: ['14', '15', '17', '18']
    env:
      POSTGRES_REQUIRE_INTEGRATION: 'true'
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      # TEMPORARY until Reseau 1.5.0 is registered: isvalid needs the unreleased
      # non-blocking tryread! API (JuliaServices/Reseau.jl nonblocking-peek).
      - name: Use unreleased Reseau
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/JuliaServices/Reseau.jl", rev="nonblocking-peek")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # TEMPORARY until Reseau 1.5.0 is registered: isvalid needs the unreleased
      # non-blocking tryread! API (JuliaServices/Reseau.jl nonblocking-peek).
      - name: Use unreleased Reseau
        shell: bash
        run: |
          julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/JuliaServices/Reseau.jl", rev="nonblocking-peek")'
          julia --project=docs -e 'using Pkg; Pkg.add(url="https://github.com/JuliaServices/Reseau.jl", rev="nonblocking-peek"); Pkg.develop(path=".")'
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          POSTGRES_DOCS_DEPLOY: ${{ github.event_name == 'push' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
